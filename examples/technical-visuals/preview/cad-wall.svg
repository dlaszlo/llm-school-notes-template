<title>A nyílás térfogatot vesz el a falból</title><rect width="1000" height="630" fill="#fafcfd"/>
<g font-family="DejaVu Sans,sans-serif" fill="#193f58">
<text x="40" y="48" font-size="29" font-weight="bold">A nyílás térfogatot vesz el a falból</text>
<text x="40" y="82" font-size="19">Egyszerű geometriai modell; áthidaló és szerkezeti méretezés nélkül.</text>
<text x="270" y="125" text-anchor="middle" font-size="19">Térbeli nézet</text>
<text x="750" y="125" text-anchor="middle" font-size="19">Elölnézet</text>
<text x="40" y="510" font-size="20">Fal: 3,00 × 2,80 m; vastagság: 0,30 m. Nyílás: 1,20 × 1,40 m.</text><text x="40" y="539" font-size="20">Nettó térfogat: (3,00 × 2,80 − 1,20 × 1,40) × 0,30 = 2,016 m³.</text></g>
