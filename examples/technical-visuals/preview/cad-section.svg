<text x="40" y="82" font-size="19">A térbeli tartó és az elölnézeti keresztmetszet összetartozik.</text>
<text x="270" y="125" text-anchor="middle" font-size="19">Térbeli nézet</text>
<text x="750" y="125" text-anchor="middle" font-size="19">Elölnézet</text>
<text x="40" y="510" font-size="20">Magasság: 200 mm; övszélesség: 120 mm; övvastagság: 12 mm.</text><text x="40" y="539" font-size="20">Gerincvastagság: 8 mm. Terület: 2 × 120 × 12 + 8 × 176 = 4288 mm².</text></g>
