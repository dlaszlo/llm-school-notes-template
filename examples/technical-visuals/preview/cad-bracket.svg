<text x="40" y="82" font-size="19">A furatok a modell részei; a nézeteket ugyanaz a test adja.</text>
<text x="270" y="125" text-anchor="middle" font-size="19">Térbeli nézet</text>
<text x="750" y="125" text-anchor="middle" font-size="19">Elölnézet</text>
<text x="40" y="510" font-size="20">Külső méret: 80 × 50 × 60 mm; lemezvastagság: 8 mm.</text><text x="40" y="539" font-size="20">Három átmenő furat: Ø10 mm. Szemléltető modell, nem gyártási rajz.</text></g>
