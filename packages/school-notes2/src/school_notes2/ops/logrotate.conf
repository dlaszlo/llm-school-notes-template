# Main JSONL log, kept 90 days (plan 8.6). The tool reopens the file for every line,
# so a plain rename + create is safe (no copytruncate, no lost lines). Install as /etc/logrotate.d/school-notes.
/srv/school-notes/logs/school-notes.log {
    su dlaszlo dlaszlo
    daily
    rotate 90
    missingok
    notifempty
    compress
    delaycompress
    create 0600 dlaszlo dlaszlo
}
