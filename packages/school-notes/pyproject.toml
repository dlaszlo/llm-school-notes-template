[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-notes"
version = "0.1.0"
description = "Single-writer, evidence-bound School Notes supervisor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
school-notes = "school_notes.cli:main"

[tool.setuptools.packages.find]
include = ["school_notes*"]
